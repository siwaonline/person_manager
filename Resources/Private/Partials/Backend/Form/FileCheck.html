<f:if condition="{first}=='1'">
    <f:then>
        <f:form.checkbox name="first" value="1" checked="checked" />
    </f:then>
    <f:else>
        <f:form.checkbox name="first" value="1" />
    </f:else>
</f:if>
<f:form.textfield name="filen" value="{filename}" />
<f:form.textfield name="check" value="1" />
